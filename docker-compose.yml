services:
  postgres:
    image: postgres:16
    container_name: nba_db
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba123
      POSTGRES_DB: nba_stats
    ports:
      - "5432:5432"
    volumes:
      # Arquivos .sql são executados em ordem alfabética na primeira inicialização
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - nba_data:/var/lib/postgresql/data

volumes:
  nba_data:
